name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: nona, POSTGRES_PASSWORD: nona, POSTGRES_DB: postgres }
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U nona" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://nona:nona@localhost:5433/nona
      TEST_ADMIN_DATABASE_URL: postgres://nona:nona@localhost:5433/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --check . --log-level warn
      - run: pnpm --filter @nona/contracts --filter @nona/mail --filter @nona/payments build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm audit --prod --audit-level high
