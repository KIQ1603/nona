# Render Blueprint (New > Blueprint): creates the PostgreSQL database AND the API+worker web service, wired together.
# No variable has to be typed: DATABASE_URL comes from the database, secrets are generated by Render.
# The web app lives on Vercel: see docs/runbooks/deploy-render.md. Change WEB_ORIGIN to the real Vercel address afterwards.
#
# DEMO MODE until VNPay exists: simulated payments, images kept in memory (lost on restart), NODE_ENV=development.
# For real sales set NODE_ENV=production, PAYMENTS_MODE=vnpay, VNPAY_*, STORAGE_DRIVER=s3 and S3_* (see the runbook).
databases:
  - name: nona-db
    plan: free
    region: singapore
    databaseName: nona
    user: nona

services:
  - type: web
    name: nona-api
    runtime: node
    plan: free
    region: singapore
    branch: main
    healthCheckPath: /v1/health/live
    buildCommand: >-
      corepack enable &&
      pnpm install --frozen-lockfile --prod=false &&
      pnpm --filter "@nona/api..." --filter "@nona/worker..." build
    startCommand: bash scripts/render-start.sh
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: ENABLE_EXPERIMENTAL_COREPACK
        value: '1'
      - key: NODE_ENV
        value: development
      - key: DATABASE_URL
        fromDatabase:
          name: nona-db
          property: connectionString
      # exact origin of the Vercel site (no trailing slash): replace with the real one
      - key: WEB_ORIGIN
        value: https://nona.vercel.app
      - key: API_PUBLIC_URL
        value: https://nona-api.onrender.com
      - key: MEDIA_BASE_URL
        value: https://nona.vercel.app/media
      - key: TRUST_PROXY_HOPS # Vercel rewrite + Render proxy
        value: 2
      # images are kept in memory in demo mode; use s3 (Cloudflare R2) + S3_* to keep them
      - key: STORAGE_DRIVER
        value: memory
      # --- secrets, generated once by Render ---
      - key: INTERNAL_API_TOKEN
        generateValue: true
      - key: OTP_SECRET
        generateValue: true
      - key: MFA_ENCRYPTION_KEY
        generateValue: true
      - key: PAYMENTS_MODE
        value: simulator
      # --- phone verification: Firebase Phone Auth, public web config (docs/runbooks/firebase-phone-auth.md) ---
      - key: SMS_MODE
        value: simulator
      - key: FIREBASE_PROJECT_ID
        value: nona-443a9
      - key: FIREBASE_API_KEY
        value: AIzaSyBai0UeUuPy6q0Cx7_xGBuZuZTllxaQiWY
      - key: FIREBASE_AUTH_DOMAIN
        value: nona-443a9.firebaseapp.com
      - key: FIREBASE_APP_ID
        value: 1:925938223939:web:d6c2207da777ec8bf93df6
      # Google sign-in, email (SMTP), VNPay, R2, Zalo/eSMS: add later in the Render dashboard (Environment > Add from .env);
      # names and meaning are in .env.example.
