name: nona
services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: nona, POSTGRES_PASSWORD: nona, POSTGRES_DB: nona }
    ports: ['5433:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nona -d nona']
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ['6390:6379']
    healthcheck: { test: ['CMD', 'redis-cli', 'ping'], interval: 3s, timeout: 3s, retries: 20 }
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: nona, MINIO_ROOT_PASSWORD: nona-secret }
    ports: ['9000:9000', '9001:9001']
    volumes: [miniodata:/data]
  mailpit:
    image: axllent/mailpit
    ports: ['1025:1025', '8025:8025']
volumes:
  pgdata:
  miniodata:
